# Why does this file exist? It carries the Crimson Noir OS runtime's bridge to a host in the cloud. The runtime's
# bridge (crimson_noir_os/src/wire.rs) speaks ws:// to this machine only: it has no TLS and looks up no names, so the
# bootable image's air gap and the runtime's own dependency list stay as they are. This nginx, on the runtime's
# machine, listens on 127.0.0.1:8787 and carries those bytes over TLS to the cloud proxy (nginx.conf), checking the
# proxy's certificate against the system's trusted roots and its name, so a man in the middle gets nothing:
#   nginx -c /path/to/bridge-tunnel.conf        (or in Docker, with --network host and this file as nginx.conf)
#   CRIMSON_TOKEN=... cargo run -- bridge ws://127.0.0.1:8787
# Replace ledger.example.com (twice) with the proxy's name. The token is still the only credential, end to end.
# What breaks if it is removed? Nothing; a runtime can only sync with a host on its own machine.

worker_processes 1;
pid /tmp/bridge-tunnel.pid;
error_log /dev/stderr notice;

events {
    worker_connections 64;
}

stream {
    server {
        listen 127.0.0.1:8787;
        proxy_pass ledger.example.com:443;
        proxy_ssl on;
        proxy_ssl_server_name on;
        proxy_ssl_name ledger.example.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
