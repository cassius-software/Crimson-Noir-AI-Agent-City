# Why does this file exist? It is how a client machine reaches a host in the cloud. Both kinds of client on that
# machine connect to 127.0.0.1 only, by design:
# - the game page: its loopback gate and its content policy refuse every other address;
# - a Crimson Noir OS runtime's bridge (crimson_noir_os/src/wire.rs): it has no TLS and looks up no names, so the
#   bootable image's air gap and the runtime's own dependency list stay as they are.
# This nginx, on the client's machine, listens on 127.0.0.1:8787 and carries those bytes over TLS to the cloud proxy
# (nginx.conf). It checks the proxy's certificate against the system's trusted roots and its name, so a man in the
# middle gets nothing. The session token stays the only credential, end to end.
#   the game:   net join ws://127.0.0.1:8787 <token>        (the page opened as a file)
#   a runtime:  CRIMSON_TOKEN=... cargo run -- bridge ws://127.0.0.1:8787
# Replace ledger.example.com (twice) with the proxy's name. Run it with:
# - nginx itself: nginx -c "$PWD/bridge-tunnel.conf". A distribution's nginx loads the stream module dynamically:
#   uncomment the load_module line below (Debian/Ubuntu: libnginx-mod-stream).
# - Docker on Linux (the same hardening as the server's proxy):
#   docker run -d --name crimson-tunnel --restart unless-stopped --network host --cap-drop ALL \
#     --security-opt no-new-privileges:true --read-only --tmpfs /tmp:size=16m --pids-limit 64 --memory 128m \
#     -v "$PWD/bridge-tunnel.conf:/etc/nginx/nginx.conf:ro" \
#     nginxinc/nginx-unprivileged:stable-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
# - Docker Desktop (Windows, macOS), whose containers do not share the machine's 127.0.0.1: change the listen line to
#   `listen 8787;`, drop --network host, and add -p 127.0.0.1:8787:8787 instead.
# The proxy's name is looked up once, when nginx starts: restart the tunnel if the server's address changes.
# What breaks if it is removed? Nothing; clients can only reach a host on their own machine.

# load_module modules/ngx_stream_module.so;

worker_processes 1;
pid /tmp/bridge-tunnel.pid;
error_log /dev/stderr notice;

events {
    worker_connections 64;
}

stream {
    server {
        listen 127.0.0.1:8787;
        proxy_pass ledger.example.com:443;
        proxy_ssl on;
        proxy_ssl_server_name on;
        proxy_ssl_name ledger.example.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
