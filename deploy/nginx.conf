# Why does this file exist? It is the TLS reverse proxy in front of the authoritative host: browsers and the OS
# runtime's tunnel (bridge-tunnel.conf) speak wss:// to it, and it speaks plain ws:// to the host over an internal
# network that nothing else joins (compose.yaml). The host does what it always did: it checks the session token in the
# subprotocol, the seals, the frames and the rules. This adds what the host leaves to its proxy:
# - TLS, versions 1.2 and 1.3 only, forward-secret AEAD ciphers, and the hybrid post-quantum key exchange first
#   (X25519MLKEM768: the pinned image's OpenSSL is 3.5). HSTS for two years. No HTTP/2: WebSockets here are HTTP/1.1.
# - One door: GET / with Upgrade: websocket. Any other path is 404, any other method 405, a plain GET 426.
# - The origin check. Browsers send Origin and may be checked; the only pages expected are the game opened as a file
#   (Origin "null") and pages on origins the operator adds below. No Origin at all is a client that is not a browser
#   (the OS runtime's tunnel, the tools), whose token is its only credential anyway.
# - Per-address limits. Behind this proxy every client reaches the host from one address, so the host's own throttle
#   cannot tell clients apart; here 30 upgrades a minute (bursts of 20) and 16 open sockets per client address.
# - Logs without credentials: the token rides a request header, never the URL, and no header is logged.
# Runs as nginx-unprivileged (uid 101) on a read-only root: listens on 8080 and 8443 (compose maps 80 and 443), keeps
# its pid and temp files in /tmp, reads the certificate from /etc/nginx/tls.
# What breaks if it is removed? Nothing off this machine can reach the host safely.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    default_type text/plain;
    log_format door '$remote_addr [$time_local] "$request_method $uri" $status $request_time '
                    'up=$upstream_status origin="$http_origin"';
    access_log /dev/stdout door;

    # The Connection header the upgrade needs.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Which browser pages may open a socket here. Add the origin the game is served from, if it is served at all.
    map $http_origin $origin_allowed {
        default 0;
        ''      1;  # not a browser: the OS runtime's tunnel, the tools
        'null'  1;  # the game opened as a file (dist/index.html), offline
        # 'https://play.example.com' 1;
    }

    limit_req_zone $binary_remote_addr zone=upgrades:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=sockets:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Behind a load balancer that terminates nothing but forwards the client's address, trust it here (and only it):
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header proxy_protocol;

    # Docker's embedded DNS, asked again every 10 s: the host keeps its name when it restarts, not always its address.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;

    # Port 80: the ACME challenge (for a certificate's renewal by webroot) and a redirect, nothing else.
    server {
        listen 8080 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl default_server;
        server_name _;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            if ($request_method != GET) {
                return 405;
            }
            if ($origin_allowed = 0) {
                return 403;
            }
            if ($http_upgrade !~* ^websocket$) {
                return 426;
            }
            limit_req zone=upgrades burst=20 nodelay;
            limit_conn sockets 16;

            # The host's name on the internal network (compose.yaml); a variable, so it is resolved as it changes.
            set $host_upstream http://host:8787;
            proxy_pass $host_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
