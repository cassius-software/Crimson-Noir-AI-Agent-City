# Proprietary core of Crimson Noir OS / Agent City. Not open source; licensed under the terms in LICENSE.
# Why does this file exist? The UEFI image must build to the same bytes from the same commit, so a release's media can
# be rebuilt and compared. The linker (lld-link) stamps the PE header and the debug directory with the build time;
# /Brepro writes a hash of the output there instead. rustc also links with /DEBUG, which makes lld write a PDB beside
# the image, derive the image's CodeView GUID from that PDB and hash the image, GUID included: the PDB embeds the
# build host's absolute paths, so the same commit built in two directories gave the same code and data under two
# stamps (v1.0.1-stable-release: 0xefa3b9b5 on the runner, 0xe9cd5aa1 in a container). /DEBUG:NONE, given after
# rustc's own /DEBUG, is the one that counts: no PDB, no GUID, and the stamp is a hash of the code alone, the
# commit's wherever it is built. Nothing else about the build varies.
# What breaks if it is removed? Two builds of one commit differ in two timestamps, and the release's checksums with them.
# The aarch64 image links with the same lld-link and takes the same two arguments.
[target.x86_64-unknown-uefi]
rustflags = ["-C", "link-arg=/Brepro", "-C", "link-arg=/DEBUG:NONE"]

[target.aarch64-unknown-uefi]
rustflags = ["-C", "link-arg=/Brepro", "-C", "link-arg=/DEBUG:NONE"]

# riscv64: Rust has no riscv64 UEFI target and its linker writes no RISC-V PE file, so the image is the bare-metal
# target linked position-independent at address 0 behind a PE header of its own (boot/riscv64.ld,
# boot/src/arch/riscv64.rs), and the linker writes the finished file itself (--oformat=binary): no second tool.
# The other arguments: no dynamic linker is named and the relocations the entry applies may sit in any section
# (-znotext) with nothing made read-only behind its back (-znorelro); no relaxation, which would address data through
# gp, a register that is the firmware's; and no build id, so nothing in the file varies from one build to the next.
[target.riscv64gc-unknown-none-elf]
rustflags = ["-C", "relocation-model=pie", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker", "-C", "link-arg=-znotext", "-C", "link-arg=-znorelro", "-C", "link-arg=--no-relax", "-C", "link-arg=--build-id=none", "-C", "link-arg=--oformat=binary"]
