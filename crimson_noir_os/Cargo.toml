[package]
name = "crimson_noir_os"
version = "0.9.0"
edition = "2024"
license-file = "LICENSE"
description = "Crimson Noir OS hosted runtime: the Global Matrix on wgpu compute, the self-test, the terminal and the tutorial frames"
publish = false

[dependencies]
noir_core = { path = "crates/noir_core" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"

[build-dependencies]
noir_core = { path = "crates/noir_core" }

[workspace]
members = [".", "crates/noir_core", "boot"]
default-members = [".", "crates/noir_core"]
resolver = "3"

[profile.dev]
# The kernels' tests run thousands of ticks of 4,096 agents.
opt-level = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2
