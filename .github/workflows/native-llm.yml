# Why does this file exist? It tests the native model runner (native/llm: llama.cpp in the app's own process, for the
# macOS, Linux, Android and iOS apps) on the three kinds of runner whose processors those apps run on: x86-64 Linux,
# Arm Linux (built for the base armv8-a, as Android's is) and Apple Silicon. Each job builds the crate with the release
# profile the app uses, runs clippy, runs every test on the tiny model (tools/browser/tinyGguf.mjs, written in the
# run), and then the real-model tests on the site's model (Qwen2.5 0.5B Instruct, the phones' model): its turn markers,
# its template, an answer that ends by itself, and the kept context giving the same greedy answer. The model comes
# from the cache keyed by its pin (the web workflow's key; an entry saved on another system is not restored here),
# else from Hugging Face at the pinned revision, and is checked against the pin's size and SHA-256 either way.
# It runs on a pull request or a push to main that touches the crate, the tiny model's writer, the pin or this file
# (a push to main seeds the caches pull requests restore), and by hand. It is not part of ci.yml, which runs on every
# change and whose failures wake the self-healing workflow: its sandbox has no cmake or libclang for llama.cpp.
# What breaks if it is removed? The runner's tests, and the only run of a real model through it, run nowhere.

name: native-llm

on:
  pull_request:
    paths:
      - native/llm/**
      - tools/browser/tinyGguf.mjs
      - src/09_Cognition/siteModel.ts
      - tools/web/siteModel.mjs
      - .github/workflows/native-llm.yml
  push:
    branches: [main]
    paths:
      - native/llm/**
      - tools/browser/tinyGguf.mjs
      - src/09_Cognition/siteModel.ts
      - tools/web/siteModel.mjs
      - .github/workflows/native-llm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-llm-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: '1.97.0'
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: native-llm (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with clippy
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - name: cmake and libclang for llama.cpp's build (bindgen loads libclang; Xcode has both on macOS)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/llm/target
          key: native-llm-${{ matrix.runner }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('native/llm/Cargo.lock') }}
          restore-keys: native-llm-${{ matrix.runner }}-${{ env.RUST_TOOLCHAIN }}-
      - name: The tiny models (one file, its two shards, and one without a chat template)
        run: |
          for form in "" --split --plain; do node tools/browser/tinyGguf.mjs "$RUNNER_TEMP/tiny" $form; done
          echo "TINY_GGUF_DIR=$RUNNER_TEMP/tiny" >> "$GITHUB_ENV"
      - name: Build with the app's release profile, and clippy
        run: |
          cargo build --manifest-path native/llm/Cargo.toml --release --locked
          cargo clippy --manifest-path native/llm/Cargo.toml --release --locked --all-targets -- -D warnings
      - name: Every test on the tiny model
        run: cargo test --manifest-path native/llm/Cargo.toml --release --locked
      - id: model
        name: The site's model, by the page's own pin
        run: node tools/web/siteModel.mjs pin | tee -a "$GITHUB_OUTPUT"
      - id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/site-model
          key: ${{ steps.model.outputs.key }}
      - name: The site's model from Hugging Face, at the pinned revision (only when the cache does not hold it)
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.model.outputs.url }}
          FILE: ${{ steps.model.outputs.file }}
        run: |
          mkdir -p "$RUNNER_TEMP/site-model"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 4 --retry-all-errors --retry-delay 5 "$URL" -o "$RUNNER_TEMP/site-model/$FILE"
      - name: It is exactly the pinned file (size and SHA-256)
        run: node tools/web/siteModel.mjs check --from "$RUNNER_TEMP/site-model"
      - name: The real-model tests (turn markers, template, an answer that ends by itself, the kept context)
        env:
          FILE: ${{ steps.model.outputs.file }}
        run: REAL_GGUF="$RUNNER_TEMP/site-model/$FILE" cargo test --manifest-path native/llm/Cargo.toml --release --locked --test real -- --ignored --nocapture --test-threads=1
      - name: Leave llama.cpp's CMake build folder out of the cache (its libraries are already inside the crate's rlib)
        if: always()
        run: rm -rf native/llm/target/release/build/llama-cpp-sys-2-*/out/build
