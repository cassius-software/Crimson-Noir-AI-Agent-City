# Why does this file exist? It publishes the installable copy of the city (dist-web/, written by tools/web/pwa.mjs) on
# GitHub Pages, so an iPhone can open it over https (Safari gives WebGPU to a secure page only), add it to the home
# screen and play it offline. The address is https://<owner>.github.io/<repository>/; MANUAL.md "On an iPhone" says
# what is and is not served. It needs the repository's Pages source set to "GitHub Actions" once (Settings > Pages).
# When it runs:
# - on its own, each time ci.yml passes on main (a push, or ci run by hand on main), so the copy follows main. It
#   builds the commit ci tested, and publishes it only while that commit is still main's tip (checked before the
#   build and again just before the deploy, so a re-run of an old run's failed jobs cannot put an old build back):
#   when main has moved on, a newer commit's green ci publishes instead. The copy never steps back to an older build
#   and never shows a commit ci has not passed. A ci run that failed, was cancelled (a newer merge cancels the one
#   before it) or checked a pull request publishes nothing, so during a burst of merges the copy is published once,
#   after the last one's ci passes.
# - by hand: Actions > web > Run workflow, on main; it publishes main as it is, without waiting for ci. (A tag would
#   also need a tag rule on the github-pages environment, which allows only the default branch by default.)
# What breaks if it is removed? Nothing else: dist-web/ can still be served from any https host by hand.

name: web

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a second run waits for the first rather than cancelling a deployment halfway, and a newer
# one waiting takes the place of an older one waiting (which would find main had moved on anyway). A run for a ci that
# did not pass on main publishes nothing, so it waits in a group of its own and never takes a real one's place.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.conclusion == 'success' &&
    (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    && 'pages' || format('pages-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Which commit to publish, if any.
  pick:
    # A green ci on main in this repository (a push, or ci started by hand there), or this run started by hand. A
    # fork's pull request from a branch it named main also reports head_branch main, so the event and the repository
    # are checked as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        name: The commit ci passed, while it is still main's tip (or the ref started by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "sha=$TESTED" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ci passed on $TESTED, but main is at $tip now; only main's tip is published."
          fi

  build:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The single-file build, made installable (manifest, icons, offline service worker)
        run: npm run build:web
      # The site's model (src/09_Cognition/siteModel.ts SITE_MODEL), served beside the page so a visitor can get it in a
      # tap on Sloane's card: fetched from Hugging Face at the pinned revision whenever the cache, keyed by the whole
      # pin, lacks it, and checked against the pin's size and SHA-256 on every publish, cached or not. A file that fails
      # the check is never cached and fails the run, so the copy already published (with its model) stays up.
      - id: model
        name: The site's model, by the page's own pin
        run: node tools/web/siteModel.mjs pin >> "$GITHUB_OUTPUT"
      - id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/site-model
          key: ${{ steps.model.outputs.key }}
      - name: The site's model from Hugging Face, at the pinned revision (only when the cache does not hold it)
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.model.outputs.url }}
          FILE: ${{ steps.model.outputs.file }}
        run: |
          mkdir -p "$RUNNER_TEMP/site-model"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 4 --retry-all-errors --retry-delay 5 "$URL" -o "$RUNNER_TEMP/site-model/$FILE"
      - name: The site's model beside the page (dist-web/models/ only), checked against the pin
        run: node tools/web/siteModel.mjs place --from "$RUNNER_TEMP/site-model" --out dist-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: [pick, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # "Re-run failed jobs" on an old run keeps pick's old answer, so the tip is asked again here.
      - id: tip
        name: Still main's tip (an automatic run only)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PICKED: ${{ needs.pick.outputs.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$PICKED" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::built $PICKED, but main is at $tip now; only main's tip is published."
          fi
      - id: deployment
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
      # A look at what the site now serves, without downloading the model (a full download would count against the
      # site's monthly bandwidth on every publish): the manifest, and the model's size as the site reports it. It only
      # notes what it finds; the publish has already happened.
      - name: The site serves the model (its manifest and its size; a note only)
        if: steps.tip.outputs.deploy == 'true'
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            manifest=$(curl -sSf "${PAGE}models/manifest.json" 2>/dev/null) && break
            sleep 20
          done
          if [ -z "$manifest" ]; then
            echo "::warning::${PAGE}models/manifest.json is not served yet"
            exit 0
          fi
          file=$(printf '%s' "$manifest" | sed -n 's/.*"file":"\([^"]*\)".*/\1/p')
          bytes=$(printf '%s' "$manifest" | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')
          head=$(curl -sSfI -H 'Accept-Encoding: identity' "${PAGE}models/${file}" 2>/dev/null | tr -d '\r') || true
          length=$(printf '%s\n' "$head" | sed -n 's/^[Cc]ontent-[Ll]ength: *//p' | tail -n 1)
          if [ "$length" = "$bytes" ]; then
            echo "::notice::${file} is served, ${length} bytes, as the manifest says"
          else
            echo "::warning::${file}: the site reports ${length:-no} Content-Length; the manifest says ${bytes}"
          fi
