# Why does this file exist? It publishes the installable copy of the city (dist-web/, written by tools/web/pwa.mjs) on
# GitHub Pages, so an iPhone can open it over https (Safari gives WebGPU to a secure page only), add it to the home
# screen and play it offline. The address is https://<owner>.github.io/<repository>/; MANUAL.md "On an iPhone" says
# what is and is not served. It needs the repository's Pages source set to "GitHub Actions" once (Settings > Pages).
# When it runs:
# - on its own, each time ci.yml passes on a push to main, so the copy follows main. It builds the commit ci tested,
#   and only while that commit is still main's tip: when main has moved on, the newer commit's own green ci publishes
#   that one instead, so the copy never steps back to an older build and never shows a commit ci has not passed. A ci
#   run that failed, was cancelled (a newer merge cancels the one before it) or checked a pull request publishes
#   nothing, so during a burst of merges the copy is published once, after the last one's ci passes.
# - by hand: Actions > web > Run workflow, on main or a tag; it publishes that ref as it is, without waiting for ci.
# What breaks if it is removed? Nothing else: dist-web/ can still be served from any https host by hand.

name: web

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a second run waits for the first rather than cancelling a deployment halfway, and a newer
# one waiting takes the place of an older one waiting (which would find main had moved on anyway). A run for a ci that
# did not pass on a push publishes nothing, so it waits in a group of its own and never takes a real one's place.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    && 'pages' || format('pages-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Which commit to publish, if any.
  pick:
    # A green ci of a push to main in this repository, or a run started by hand. A fork's pull request from a branch
    # it named main also reports head_branch main, so the event and the repository are checked as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        name: The commit ci passed, while it is still main's tip (or the ref started by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "sha=$TESTED" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ci passed on $TESTED, but main is at $tip now: that commit's own ci publishes it."
          fi

  build:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The single-file build, made installable (manifest, icons, offline service worker)
        run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
