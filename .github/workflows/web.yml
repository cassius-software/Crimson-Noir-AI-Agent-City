# Why does this file exist? It publishes the installable copy of the city (dist-web/, written by tools/web/pwa.mjs) on
# GitHub Pages, so an iPhone can open it over https (Safari gives WebGPU to a secure page only), add it to the home
# screen and play it offline. The address is https://<owner>.github.io/<repository>/; MANUAL.md "On an iPhone" says
# what is and is not served. It needs the repository's Pages source set to "GitHub Actions" once (Settings > Pages).
# When it runs:
# - on its own, each time ci.yml passes on main (a push, or ci run by hand on main), so the copy follows main. It
#   builds the commit ci tested, and publishes it only while that commit is still main's tip (checked before the
#   build and again just before the deploy, so a re-run of an old run's failed jobs cannot put an old build back):
#   when main has moved on, a newer commit's green ci publishes instead. The copy never steps back to an older build
#   and never shows a commit ci has not passed. A ci run that failed, was cancelled (a newer merge cancels the one
#   before it) or checked a pull request publishes nothing, so during a burst of merges the copy is published once,
#   after the last one's ci passes.
# - by hand: Actions > web > Run workflow, on main; it publishes main as it is, without waiting for ci. (A tag would
#   also need a tag rule on the github-pages environment, which allows only the default branch by default.)
# Before the upload, tools/verify/site_budget.mjs sums every file of dist-web/, the model included, and fails the run
# when the copy is over 950 MB: GitHub Pages publishes no site over 1 GB. After the deploy, a look at the site notes
# whether it hands out part of the model (a 206 to bytes=0-0, and to a range under If-Range with its ETag) and whether
# the deploy kept the model's ETag: the page picks a stopped download up only so (src/09_Cognition/siteModel.ts
# downloadSiteModel). It warns, never fails: a site that answers 200 still serves the model, whole.
# What breaks if it is removed? Nothing else: dist-web/ can still be served from any https host by hand.

name: web

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a second run waits for the first rather than cancelling a deployment halfway, and a newer
# one waiting takes the place of an older one waiting (which would find main had moved on anyway). A run for a ci that
# did not pass on main publishes nothing, so it waits in a group of its own and never takes a real one's place.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.workflow_run.conclusion == 'success' &&
    (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    && 'pages' || format('pages-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Which commit to publish, if any.
  pick:
    # A green ci on main in this repository (a push, or ci started by hand there), or this run started by hand. A
    # fork's pull request from a branch it named main also reports head_branch main, so the event and the repository
    # are checked as well.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        name: The commit ci passed, while it is still main's tip (or the ref started by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$TESTED" ]; then
            echo "sha=$TESTED" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ci passed on $TESTED, but main is at $tip now; only main's tip is published."
          fi

  build:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The single-file build, made installable (manifest, icons, offline service worker)
        run: npm run build:web
      # The site's model (src/09_Cognition/siteModel.ts SITE_MODEL), served beside the page so a visitor can get it in a
      # tap on Sloane's card: fetched from Hugging Face at the pinned revision whenever the cache, keyed by the whole
      # pin, lacks it, and checked against the pin's size and SHA-256 on every publish, cached or not. A file that fails
      # the check is never cached and fails the run, so the copy already published (with its model) stays up.
      - id: model
        name: The site's model, by the page's own pin
        run: node tools/web/siteModel.mjs pin >> "$GITHUB_OUTPUT"
      - id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/site-model
          key: ${{ steps.model.outputs.key }}
      - name: The site's model from Hugging Face, at the pinned revision (only when the cache does not hold it)
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.model.outputs.url }}
          FILE: ${{ steps.model.outputs.file }}
        run: |
          mkdir -p "$RUNNER_TEMP/site-model"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 4 --retry-all-errors --retry-delay 5 "$URL" -o "$RUNNER_TEMP/site-model/$FILE"
      - name: The site's model beside the page (dist-web/models/ only), checked against the pin
        run: node tools/web/siteModel.mjs place --from "$RUNNER_TEMP/site-model" --out dist-web
      # The speech pack (src/09_Cognition/speechPack.ts SPEECH_PACK), served beside the page so the microphone
      # understands words in every browser, on the visitor's own device: the model's two files come from the npm
      # registry's tarball of the pinned package whenever the cache, keyed by the whole pin, lacks them; the runtime's
      # module is the installed dependency's; the vocabulary is committed. All four are checked against the pin's sizes
      # and SHA-256 on every publish, cached or not. A file that fails the check fails the run, so the copy already
      # published (with its pack) stays up.
      - id: speech
        name: The speech pack, by the page's own pin
        run: node tools/web/speechPack.mjs pin >> "$GITHUB_OUTPUT"
      - id: speech-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/speech-pack
          key: ${{ steps.speech.outputs.key }}
      - name: The speech model from the npm registry, at the pinned version (only when the cache does not hold it)
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: node tools/web/speechPack.mjs fetch --to "$RUNNER_TEMP/speech-pack"
      - name: The speech pack beside the page (dist-web/speech/ only), checked against the pin
        run: node tools/web/speechPack.mjs place --from "$RUNNER_TEMP/speech-pack" --out dist-web
      # Every file of the copy, the model and the speech pack included, summed: a copy over the budget fails the run before the upload, so
      # the copy already published stays up.
      - name: The web copy, the model included, is at most 950 MB (GitHub Pages publishes no site over 1 GB)
        run: node tools/verify/site_budget.mjs site dist-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: [pick, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # "Re-run failed jobs" on an old run keeps pick's old answer, so the tip is asked again here.
      - id: tip
        name: Still main's tip (an automatic run only)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PICKED: ${{ needs.pick.outputs.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$PICKED" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::built $PICKED, but main is at $tip now; only main's tip is published."
          fi
      # The model's ETag as the site serves it before this deploy, so the look after it can say whether a deploy keeps
      # it (a download that stopped is picked up only under the same ETag). A note only: nothing here can fail the run,
      # and every call has its own time limit (a slow site gives no note, after 70 s at most), so it cannot hold the
      # deploy past the job's limit either.
      - id: before
        if: steps.tip.outputs.deploy == 'true'
        name: The model's ETag before this deploy (a note only)
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          page=$(timeout 30 gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null) || page=''
          [ -n "$page" ] || exit 0
          manifest=$(curl -sSf --max-time 20 "${page%/}/models/manifest.json" 2>/dev/null) || exit 0
          file=$(printf '%s' "$manifest" | sed -n 's/.*"file":"\([^"]*\)".*/\1/p')
          sha=$(printf '%s' "$manifest" | sed -n 's/.*"sha256":"\([0-9a-f]*\)".*/\1/p')
          etag=$(curl -sSfI --max-time 20 -H 'Accept-Encoding: identity' "${page%/}/models/${file}" 2>/dev/null | tr -d '\r' | sed -n 's/^[Ee][Tt][Aa][Gg]: *//p' | tail -n 1) || true
          { echo "sha=$sha"; echo "etag=$etag"; } >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
      # A look at what the site now serves, without downloading the model (a full download would count against the
      # site's monthly bandwidth on every publish): the manifest, and the model's size as the site reports it. It only
      # notes what it finds; the publish has already happened. It has no time limit of its own, but each call has one
      # (20 s, the manifest asked six times at most), so a site that stalls ends it after 260 s at most.
      - name: The site serves the model (its manifest and its size; a note only)
        if: steps.tip.outputs.deploy == 'true'
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            manifest=$(curl -sSf --max-time 20 "${PAGE}models/manifest.json" 2>/dev/null) && break
            sleep 20
          done
          if [ -z "$manifest" ]; then
            echo "::warning::${PAGE}models/manifest.json is not served yet"
            exit 0
          fi
          file=$(printf '%s' "$manifest" | sed -n 's/.*"file":"\([^"]*\)".*/\1/p')
          bytes=$(printf '%s' "$manifest" | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')
          head=$(curl -sSfI --max-time 20 -H 'Accept-Encoding: identity' "${PAGE}models/${file}" 2>/dev/null | tr -d '\r') || true
          length=$(printf '%s\n' "$head" | sed -n 's/^[Cc]ontent-[Ll]ength: *//p' | tail -n 1)
          if [ "$length" = "$bytes" ]; then
            echo "::notice::${file} is served, ${length} bytes, as the manifest says"
          else
            echo "::warning::${file}: the site reports ${length:-no} Content-Length; the manifest says ${bytes}"
          fi
          if speech=$(curl -sSf --max-time 20 "${PAGE}speech/manifest.json" 2>/dev/null) && [ -n "$speech" ]; then
            echo "::notice::the speech pack's manifest is served: $(printf '%s' "$speech" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          else
            echo "::warning::${PAGE}speech/manifest.json is not served"
          fi
      # Whether the site hands out only part of the model, as the page asks when it picks up a download that stopped
      # (Range from where it stopped, If-Range its ETag): its first byte must come as a 206 of bytes 0-0, and its second,
      # asked under If-Range with the ETag it gave, as a 206 too; and whether this deploy kept the ETag the model had
      # before it. Two bytes, not the model. A warning only: a site that answers 200 serves the model whole, and the
      # page then starts such a download over.
      - name: The site hands out part of the model, under a strong ETag that the deploy kept (a note only)
        if: steps.tip.outputs.deploy == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          BEFORE_ETAG: ${{ steps.before.outputs.etag }}
        run: |
          manifest=$(curl -sSf --max-time 20 "${PAGE}models/manifest.json" 2>/dev/null) || { echo "::warning::${PAGE}models/manifest.json is not served, so no range was asked"; exit 0; }
          file=$(printf '%s' "$manifest" | sed -n 's/.*"file":"\([^"]*\)".*/\1/p')
          bytes=$(printf '%s' "$manifest" | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')
          sha=$(printf '%s' "$manifest" | sed -n 's/.*"sha256":"\([0-9a-f]*\)".*/\1/p')
          # --max-filesize: a site that ignores the range answers with the whole model, which curl then refuses at once.
          head=$(curl -sS -o /dev/null -D - --max-filesize 4096 --max-time 60 -r 0-0 -H 'Accept-Encoding: identity' "${PAGE}models/${file}" 2>/dev/null | tr -d '\r') || true
          status=$(printf '%s\n' "$head" | sed -n 's/^HTTP\/[0-9.]* \([0-9]*\).*/\1/p' | tail -n 1)
          range=$(printf '%s\n' "$head" | sed -n 's/^[Cc]ontent-[Rr]ange: *//p' | tail -n 1)
          etag=$(printf '%s\n' "$head" | sed -n 's/^[Ee][Tt][Aa][Gg]: *//p' | tail -n 1)
          if [ "$status" = 206 ] && [ "$range" = "bytes 0-0/${bytes}" ]; then
            echo "::notice::${file}: bytes=0-0 is answered 206 (${range}), ETag ${etag:-none}"
          else
            echo "::warning::${file}: bytes=0-0 is answered ${status:-nothing} (Content-Range ${range:-none}), not 206 of bytes 0-0/${bytes}: a download of it that stops starts over"
          fi
          case "$etag" in
            ''|W/*)
              echo "::warning::${file}: the site gives ${etag:-no} ETag; the page picks a stopped download up only under a strong one (or Last-Modified when there is no ETag at all)" ;;
            *)
              again=$(curl -sS -o /dev/null -w '%{http_code}' --max-filesize 4096 --max-time 60 -r 1-1 -H "If-Range: ${etag}" -H 'Accept-Encoding: identity' "${PAGE}models/${file}" 2>/dev/null) || true
              if [ "$again" = 206 ]; then
                echo "::notice::${file}: a range under If-Range ${etag} is answered 206"
              else
                echo "::warning::${file}: a range under If-Range ${etag} is answered ${again:-nothing}, not 206: a download of it that stops starts over"
              fi ;;
          esac
          if [ -n "$BEFORE_ETAG" ] && [ "$BEFORE_SHA" = "$sha" ]; then
            if [ "$BEFORE_ETAG" = "$etag" ]; then
              echo "::notice::${file}: this deploy kept its ETag (${etag}), so a download of it stopped before the deploy is picked up after it"
            else
              echo "::warning::${file}: this deploy changed its ETag (${BEFORE_ETAG} to ${etag:-none}) though the model is the same: a download of it stopped before the deploy starts over after it"
            fi
          fi
