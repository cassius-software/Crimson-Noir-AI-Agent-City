# Auxiliary tooling of Crimson Noir OS / Agent City, open source under the MIT License (LICENSES/MIT.txt).
# Why does this file exist? It builds the one-click Windows app (src-tauri: a Tauri 2 window around dist/index.html)
# where it can only be built, on a Windows runner, and puts the result where a person finds it: the NSIS installer and
# the bare executable as workflow artifacts on every pull request and push to main, and, when a tag starting with v is
# pushed, on that tag's GitHub Release beside the OS media that build-release.yml bakes. The two workflows run on the
# same tag push; this one waits for the release build-release.yml creates and only makes one itself when none appears,
# so neither tramples the other (build-release.yml uploads into an existing release with --clobber).
# A tag that build-release.yml makes itself (a "Run workflow" bake of a tag that did not exist) is made with the
# workflow's own token, and GitHub starts no tag-push run for such a tag; so build-release.yml dispatches this
# workflow with the tag as its input, which builds that tag's commit and uploads to its release the same way.
# What breaks if it is removed? Nobody gets an .exe without a Windows machine with Rust, Node and NSIS on it.

name: windows-app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: A v* tag whose commit to build and whose GitHub Release to upload the app to (empty builds this ref, artifacts only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-app-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: '1.97.0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-app-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-app-${{ env.RUST_TOOLCHAIN }}-
      - run: npm ci --no-audit --no-fund
      - name: The page, then the app (npm run build, cargo build --release, the NSIS installer)
        # The cache above restores src-tauri/target with the installers of earlier versions still in bundle/nsis;
        # they go first, so only this version's installer is collected below.
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run app:build
      - name: Collect the installer and the bare executable
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out/installer out/portable
          cp src-tauri/target/release/bundle/nsis/*"_${version}_"*-setup.exe out/installer/
          cp src-tauri/target/release/*.exe out/portable/
          ls -l out/installer out/portable
          [ "$(ls out/installer | wc -l)" = 1 ] || { echo "::error::expected exactly one installer for $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: out/installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ steps.version.outputs.version }}
          path: out/portable/
          if-no-files-found: error

  # On a v* tag: the installer and the executable onto the tag's release. build-release.yml creates that release once
  # its bake is done (a quarter of an hour or more after the push); this job waits for it, and creates it only when
  # none exists after the wait, so a failed bake still leaves the Windows app where a person looks for it.
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: media
          merge-multiple: true
      - name: Upload to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for i in $(seq 1 80); do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            echo "waiting for build-release.yml to create the release $TAG ($i)"; sleep 60
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            # An installer of another version left on the release by an earlier run goes before the upload.
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.exe$' || true); do
              [ -e "media/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" media/* --clobber
          else
            echo "::warning::no release $TAG after the wait: creating it with the Windows app alone (build-release.yml adds the OS media when it runs)"
            gh release create "$TAG" media/* --verify-tag --title "Crimson Noir Agent City $TAG" --prerelease \
              --notes "The one-click Windows app: run the *-setup.exe installer, or the bare .exe (it needs the WebView2 runtime Windows 10 and 11 carry)."
          fi
