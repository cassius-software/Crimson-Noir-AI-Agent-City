# Why does this file exist? It builds the one-click Windows app (src-tauri: a Tauri 2 window around dist/index.html)
# where it can only be built, on a Windows runner, and puts the result where a person finds it: the NSIS installer, the
# .msi (from the same build; WiX takes the version's numbers alone, 1.0.0 for 1.0.0-stable-beta, and the app inside
# keeps its own) and the bare executable as workflow artifacts on every pull request and push to main, and, when a tag
# starting with v is pushed, on that tag's GitHub Release beside the OS media that build-release.yml bakes. The two
# workflows run on the same tag push; this one waits for the release build-release.yml creates and only makes one
# itself when none appears, so neither tramples the other (build-release.yml uploads into an existing release with
# --clobber).
# A tag that build-release.yml makes itself (a "Run workflow" bake of a tag that did not exist) is made with the
# workflow's own token, and GitHub starts no tag-push run for such a tag; so build-release.yml dispatches this
# workflow with the tag as its input, which builds that tag's commit and uploads to its release the same way.
# current.yml calls it (workflow_call) with a commit on main ci passed on, as `ref`: the build job builds that commit
# and leaves the same three artifacts, which current.yml puts on the `current` pre-release; the release job never runs
# for a call. The concurrency group carries the commit, so a push to main never cancels a call's build.
# The bare .exe is published as crimson-noir-app_<version>_x64.exe, so it never shares a name with the Windows on Arm
# one build-matrix.yml makes (crimson-noir-app_<version>_arm64.exe) on a release that carries both.
# The installer and the .msi carry a model beside the app (src-tauri/tauri.model.conf.json: Qwen2.5 1.5B Instruct,
# Apache-2.0, with its LICENSE and NOTICE), so Sloane talks from the first launch: the file is fetched from Hugging Face
# at the page's own pin (src/09_Cognition/siteModel.ts APP_MODEL) whenever the cache keyed by that pin does not hold
# it, and checked byte for byte on every build before it goes in (tools/web/siteModel.mjs app). The bare .exe carries
# none: it is the app alone.
# What breaks if it is removed? Nobody gets an .exe without a Windows machine with Rust, Node and NSIS on it.

name: windows-app

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: A v* tag whose commit to build and whose GitHub Release to upload the app to (empty builds this ref, artifacts only)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: The commit to build, for artifacts alone (current.yml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-app-${{ inputs.ref || inputs.tag || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: '1.97.0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-app-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-app-${{ env.RUST_TOOLCHAIN }}-
      - run: npm ci --no-audit --no-fund
      - id: model
        name: The app's model, by the page's own pin (src/09_Cognition/siteModel.ts APP_MODEL)
        run: node tools/web/siteModel.mjs pin --pin app | tee -a "$GITHUB_OUTPUT"
      - id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/app-model
          key: ${{ steps.model.outputs.key }}
      - name: The app's model from Hugging Face, at the pinned revision (only when the cache does not hold it)
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.model.outputs.url }}
          FILE: ${{ steps.model.outputs.file }}
        run: |
          mkdir -p "$RUNNER_TEMP/app-model"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 4 --retry-all-errors --retry-delay 5 "$URL" -o "$RUNNER_TEMP/app-model/$FILE"
      - name: Checked byte for byte, then into src-tauri/models/ with its LICENSE and NOTICE (on every build, a cached file too)
        run: node tools/web/siteModel.mjs app --from "$RUNNER_TEMP/app-model"
      - name: The page, then the app (npm run build, cargo build --release, the NSIS installer with the model)
        # The cache above restores src-tauri/target with the installers of earlier versions still in bundle/nsis;
        # they go first, so only this version's installer is collected below.
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run app:build -- --config src-tauri/tauri.model.conf.json
      - name: The .msi from the same binary (tauri bundle packages it without compiling; WiX gets the version's numbers)
        run: |
          numbers=$(node -p "require('./package.json').version.split(/[-+]/)[0]")
          node node_modules/@tauri-apps/cli/tauri.js bundle --bundles msi --config src-tauri/tauri.model.conf.json --config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$numbers\"}}}}"
      - name: Collect the installers and the bare executable
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out/installer out/msi out/portable
          cp src-tauri/target/release/bundle/nsis/*"_${version}_"*-setup.exe out/installer/
          cp src-tauri/target/release/bundle/msi/*"_${version}_"*.msi out/msi/
          for exe in src-tauri/target/release/*.exe; do cp "$exe" "out/portable/$(basename "$exe" .exe)_${version}_x64.exe"; done
          ls -l out/installer out/msi out/portable
          [ "$(ls out/installer | wc -l)" = 1 ] || { echo "::error::expected exactly one installer for $version"; exit 1; }
          [ "$(ls out/msi | wc -l)" = 1 ] || { echo "::error::expected exactly one .msi for $version"; exit 1; }
          # Each installer carries the model: neither can be smaller than nine tenths of it (the .msi's cabinet may
          # squeeze it a little; the NSIS installer stores it as it is).
          for f in out/installer/* out/msi/*; do
            size=$(stat -c %s "$f")
            [ "$size" -gt "$((MODEL_BYTES / 10 * 9))" ] || { echo "::error::$f is $size bytes: it does not carry the $MODEL_BYTES-byte model"; exit 1; }
          done
        env:
          MODEL_BYTES: ${{ steps.model.outputs.bytes }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: out/installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ steps.version.outputs.version }}
          path: out/msi/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ steps.version.outputs.version }}
          path: out/portable/
          if-no-files-found: error
      - name: The installers and the model's copies stay out of the build cache (saved after this job)
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/release/models

  # On a v* tag: the installer and the executable onto the tag's release. build-release.yml creates that release once
  # its bake is done (a quarter of an hour or more after the push); this job waits for it, and creates it only when
  # none exists after the wait, so a failed bake still leaves the Windows app where a person looks for it.
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: media
          merge-multiple: true
      - name: Upload to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in $(seq 1 80); do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            echo "waiting for build-release.yml to create the release $TAG ($i)"; sleep 60
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            # An installer of another version left on the release by an earlier run goes before the upload. This
            # version's stay, the arm64 ones build-matrix.yml uploads among them (this job's own are replaced).
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.(exe|msi)$' | grep -vF "_${VERSION}_" || true); do
              [ -e "media/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" media/* --clobber
          else
            echo "::warning::no release $TAG after the wait: creating it with the Windows app alone (build-release.yml adds the OS media when it runs)"
            gh release create "$TAG" media/* --verify-tag --title "Crimson Noir Agent City $TAG" --prerelease \
              --notes "The one-click Windows app: run the *-setup.exe installer, or the bare .exe (it needs the WebView2 runtime Windows 10 and 11 carry)."
          fi
