# Why does this file exist? It bakes Crimson Noir OS's bootable media for every release tag and attaches them to the
# tag's GitHub Release.
# - What runs it: pushing a tag that matches v* or stable-*. "Run workflow" also works, once this file is on the
#   default branch (GitHub dispatches only workflows found there): for a tag that exists, it bakes that tag's commit;
#   for a tag that does not exist yet, it bakes the commit the workflow was dispatched on and makes the tag there, as
#   part of the release. So a release can be cut from the Actions tab or the API alone.
# - The bake job has read-only access. It does what a contributor does by hand:
#   - installs the pinned Rust toolchain and the UEFI target, and fetches every crate from Cargo.lock;
#   - runs the core and hosted-runtime tests, with the GPU path on Mesa's lavapipe;
#   - bakes the image and the ISO (tools/build-image.sh). They are reproducible: the same commit and toolchain give
#     the same bytes;
#   - boots the disk image in QEMU with OVMF, through the self-test, the tutorial and the terminal's scripted run,
#     until it logs POWER OFF and the machine stops;
#   - boots the ISO to its self-test;
#   - writes SHA256SUMS.
# - Only the publish job may write. It checks the sums again and checks that the tag, if it exists, still names the
#   commit that was baked. Then it creates the release, or brings an existing one's files up to date. A release's
#   title and hand-written notes are kept: the media's description sits below a marker and only that part is refreshed.
# - No third-party action runs here, only GitHub's own checkout and artifact actions. They are on their major
#   versions; pin them to commit hashes if your policy asks for it. No cache is restored into a release build, and
#   the checkout keeps no credentials.
# - A tag push runs the workflow as it is at the tagged commit, so such a tag must point at a commit that contains
#   this file.
# What breaks if it is removed? Releases carry no media; the image is still built by hand with tools/build-image.sh.

name: build-release

on:
  push:
    tags: ['v*', 'stable-*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to bake and release (made at the dispatched commit if it does not exist yet)
        required: true
        type: string
      title:
        description: The release's title, for a release that does not exist yet (default "Crimson Noir OS (tag)")
        required: false
        type: string
      notes:
        description: Notes to put above the media's description, for a release that does not exist yet
        required: false
        type: string

permissions: {}

concurrency:
  group: build-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The toolchain the image was last built and booted with; move it on purpose.
  RUST_TOOLCHAIN: '1.97.0'
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check the tag's name
        run: |
          case "$TAG" in
            ''|-*|*[!A-Za-z0-9._-]*) printf '::error::not a tag name this workflow bakes: %q\n' "$TAG"; exit 1 ;;
          esac

      - name: Resolve what to bake (the tag's commit, or the dispatched commit for a tag not made yet)
        id: ref
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "the tag $TAG exists: baking its commit"
          else
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            echo "no tag $TAG yet: baking $GITHUB_REF, and the release will make the tag there"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Record the commit
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          test -f .github/workflows/build-release.yml || { echo "::error::$commit has no release workflow: it predates this file"; exit 1; }

      - name: Install the media tools, QEMU with OVMF, and lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mtools gdisk xorriso qemu-system-x86 ovmf mesa-vulkan-drivers

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with the UEFI target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-unknown-uefi
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Fetch the crates in Cargo.lock
        working-directory: crimson_noir_os
        run: cargo fetch --locked

      - name: Test the core and the hosted runtime (CPU and GPU, word for word)
        working-directory: crimson_noir_os
        env:
          NOIR_REQUIRE_GPU: '1'
        run: cargo test --workspace --locked --offline

      - name: Bake the disk image and the ISO
        working-directory: crimson_noir_os
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          out="$RUNNER_TEMP/media"
          sh tools/build-image.sh "$out"
          cp target/x86_64-unknown-uefi/release/crimson_boot.efi "$out/BOOTX64.EFI"
          cp containment.nix containment.lock NOTICE.txt LICENSE-MIT LICENSE-APACHE "$out/"
          rm -rf "$out/esp.img" "$out/iso"

      - name: Boot the disk image (self-test, tutorial, terminal, power-off)
        working-directory: crimson_noir_os
        run: |
          python3 -I tools/boot_test.py "$RUNNER_TEMP/media/crimson_noir_os.img" --timeout 300 --wait "SELFTEST PASS" \
            --step "wait:TUTORIAL 6 PASSED" --step 'type:\n' --step "wait:TERMINAL READY" \
            --step 'type:golden\n' --step wait:MATCH --step 'type:halt\n' --step 'wait:POWER OFF' --step exit

      - name: Boot the ISO (self-test)
        working-directory: crimson_noir_os
        run: python3 -I tools/boot_test.py "$RUNNER_TEMP/media/crimson_noir_os.iso" --timeout 300 --wait "SELFTEST PASS"

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/media
        run: |
          sha256sum crimson_noir_os.img crimson_noir_os.iso BOOTX64.EFI containment.nix containment.lock \
            NOTICE.txt LICENSE-MIT LICENSE-APACHE > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: crimson-noir-os-${{ env.TAG }}
          path: ${{ runner.temp }}/media/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: bake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.bake.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crimson-noir-os-${{ env.TAG }}
          path: media

      - name: Check the sums again
        working-directory: media
        run: sha256sum --check --strict SHA256SUMS

      - name: Create the release, or bring its files up to date
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          # A tag that exists must still name the commit that was baked: a tag moved while this ran gets a run of its own.
          exists=false
          if now=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2> /dev/null); then
            exists=true
            if [ "$now" != "$COMMIT" ]; then
              echo "::error::$TAG now names $now, not the baked $COMMIT; nothing was published"
              exit 1
            fi
          fi
          marker='<!-- build-release: media -->'
          media="$RUNNER_TEMP/media.md"
          {
            echo "$marker"
            echo "Crimson Noir OS bootable media, baked from \`$TAG\` (commit $COMMIT) with Rust $RUST_TOOLCHAIN."
            echo
            echo "- \`crimson_noir_os.img\`: a GPT disk image. Write it to a USB stick (for example"
            echo "  \`dd if=crimson_noir_os.img of=/dev/sdX bs=4M\`) and boot it on a UEFI x86-64 machine with Secure Boot off."
            echo "- \`crimson_noir_os.iso\`: a hybrid UEFI ISO, for a virtual machine's CD or a stick."
            echo "- \`BOOTX64.EFI\`, \`containment.nix\`, \`containment.lock\`: the UEFI application and the configuration it was built with;"
            echo "  \`NOTICE.txt\`, \`LICENSE-MIT\`, \`LICENSE-APACHE\`: their notices and licences."
            echo
            echo "Check them with \`sha256sum --check SHA256SUMS\`. The media are reproducible: \`sh tools/build-image.sh\` in"
            echo "\`crimson_noir_os/\` at this commit, with Rust $RUST_TOOLCHAIN, gives the same bytes. The image is unsigned."
            echo "Before this release was made, CI booted the disk image in QEMU with OVMF through the self-test, the tutorial"
            echo "and the terminal's scripted run until it logged POWER OFF, and the ISO to its self-test. No physical machine"
            echo "is part of that check. The image has no network code, and its configuration refuses one."
          } > "$media"
          prerelease=false
          if [[ "$TAG" =~ (^|[-.])(alpha|beta|rc)([-.0-9]|$) ]]; then prerelease=true; fi
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # The release's own title and notes stay; the media's description below the marker is refreshed.
            gh release view "$TAG" --json body --jq .body | sed "/$marker/,\$d" > "$notes"
            cat "$media" >> "$notes"
            gh release upload "$TAG" media/* --clobber
            gh release edit "$TAG" --notes-file "$notes" --prerelease="$prerelease"
          else
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES" > "$notes"; else : > "$notes"; fi
            cat "$media" >> "$notes"
            title=${TITLE:-"Crimson Noir OS ($TAG)"}
            if [ "$exists" = true ]; then
              gh release create "$TAG" media/* --verify-tag --title "$title" --notes-file "$notes" --prerelease="$prerelease"
            else
              # The tag is made here, at the commit that was baked.
              gh release create "$TAG" media/* --target "$COMMIT" --title "$title" --notes-file "$notes" --prerelease="$prerelease"
            fi
          fi
