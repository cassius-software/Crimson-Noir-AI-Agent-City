# Why does this file exist? web.yml publishes the web copy and current.yml publishes every download (the UEFI media
# among them) after each green ci on main, each on its own, and a run of either can end green having published
# nothing. This workflow looks at what is published (tools/build/sync.mjs check) and turns red when the web copy,
# the release's record, any required target, the tag or a file's bytes do not come from one commit, the newest one
# on main that ci passed on, with nothing on its way to mend it. Its summary lists each published thing with the
# commit it is built from.
# When it runs:
# - after each run of web or current on main ends (a run that was skipped, for a ci that did not pass, starts nothing
#   here), so a publish that skipped or failed is seen at once: a publisher's run that has ended is its answer, and
#   a web run counts as a publish only when its deploy step ran;
# - every hour, so a publisher that never started, or a run that hung, is seen within the hour (GitHub may start a
#   scheduled run late, and stops scheduling in a repository with no activity for 60 days);
# - by hand: Actions > sync > Run workflow;
# - on a pull request that changes this file, the tool or the two scripts it reads with: the same look, printed and
#   never red for what it finds (what is published is not the pull request's doing), red only if the tool itself
#   stops.
# It only reads: read access to the repository's contents and runs, no other permission, GitHub's own actions alone.
# A red run means: read its summary, then do what the line in red says (as a rule, run the publisher it names by
# hand: Actions > web or current > Run workflow, on main).
# What breaks if it is removed? Nothing is published differently; drift between the web copy and the downloads goes
# back to being found by a person comparing them.

name: sync

on:
  workflow_run:
    workflows: [web, current]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sync.yml
      - tools/build/sync.mjs
      - tools/build/current.mjs
      - tools/build/matrix.mjs

permissions: {}

# One look at a time; a newer look takes the place of one still waiting, never of one under way. A run whose job
# will be skipped (a publisher's run that was itself skipped) gets a group of its own: GitHub takes the group before
# it reads the job's condition, and a run that looks at nothing must not take a waiting look's place.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('sync-pr-{0}', github.event.pull_request.number)
    || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'skipped') && format('sync-skip-{0}', github.run_id)
    || 'sync' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    # Not for a publisher's run that was skipped (its ci did not pass on main: it published nothing and changed
    # nothing), and for a publisher's run only when it ran on main in this repository.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Is everything published built from one commit? (the web copy, the release's record, each target, the tag, the bytes)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_ONLY: ${{ github.event_name == 'pull_request' }}
        run: |
          args=(check --summary "$GITHUB_STEP_SUMMARY")
          if [ "$REPORT_ONLY" = true ]; then args+=(--report-only); fi
          node tools/build/sync.mjs "${args[@]}"
