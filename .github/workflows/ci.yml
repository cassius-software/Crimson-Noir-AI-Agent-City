# Why does this file exist? It is the standing verification of every change: the checks that were run by hand in a
# container at the end of each phase, run here on every pull request and every push to main, and the formal
# verification step (FVPS) with them. The checks are the ones tools/selfheal/checks.sh names, so a contributor, this
# workflow and the self-healing agent run the same commands. Three jobs run side by side:
# - page: tsc, oxlint, the 1,300-test suite, the single-file build with its no-server-code check, the host's smoke
#   test, and the self-healing agent's own tests;
# - rust: the OS workspace's tests on CPU and GPU (lavapipe) and clippy on every target, the native crates' tests,
#   and the WebAssembly modules rebuilt and compared with the committed ones (the air-gap check);
# - fvps: the formal step's fast parts: the SMT theorems, the LLVM-IR call graph and the WebAssembly air gap;
# - kani: the Kani proof harnesses, in groups over parallel runners, one harness at a time within a runner (the
#   model checker's memory is the bound; a GitHub runner has 16 GB). Kani is cached between runs.
# A failure of any job wakes the self-healing workflow (selfheal.yml), which may answer with a selfheal-* pull
# request and never merges anything. `workflow_dispatch` lets the agent, or a person, run this on a selfheal branch.
# What breaks if it is removed? A change is checked only when someone remembers to.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: '1.97.0'
  CARGO_TERM_COLOR: always

jobs:
  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tsc, oxlint, the test suite, the build, the smoke test, the agent's tests
        run: sh tools/selfheal/checks.sh page-tsc page-lint page-test page-build page-smoke selfheal-test

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lavapipe and python's z3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
          pip install -q z3-solver
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with the UEFI and wasm32 targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --target x86_64-unknown-uefi --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crimson_noir_os/target
            native/routing/target
            native/kv-pager/target
            native/kv-pager-wasm/target
          key: rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - name: The OS workspace's tests (CPU and GPU), clippy, the native crates, the WebAssembly modules
        env:
          NOIR_REQUIRE_GPU: '1'
        run: sh tools/selfheal/checks.sh rust-test rust-clippy native-test fvps-wasm

  fvps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install python's z3
        run: pip install -q z3-solver
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with the wasm32 target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: The SMT theorems, the IR call graph and the WebAssembly air gap
        run: sh tools/verify/fvps.sh smt && sh tools/verify/fvps.sh ir && sh tools/verify/fvps.sh wasm

  # The Kani harnesses, spread over parallel runners (each is minutes to a quarter of an hour of the checker's
  # time, and the checker runs one at a time within a job); the group names are the harnesses of
  # tools/verify/fvps.sh. A job is red when any of its harnesses fails to verify.
  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core-small
            harnesses: masks_mean_what_the_kernels_take_them_to_mean compare_exchange_orders_the_pair bitonic_pass_stays_in_bounds flush_zeroes_one_row_only
          - name: core-tick
            harnesses: agent_tick_is_isolated_to_its_own_row
          - name: core-relax
            harnesses: relax_pass_stays_in_bounds
          - name: routing-arena
            harnesses: arena_setter_never_traps no_track_is_refused_not_trapped check_never_traps_on_any_arena pose_at_never_traps_on_one_piece
          - name: routing-pieces
            harnesses: pose_at_never_traps_on_two_pieces next_stop_and_speed_limit_never_trap
          - name: routing-projection
            harnesses: no_track_is_refused_by_the_projection project_onto_never_traps_on_a_short_piece
    name: kani (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        id: kani
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ runner.os }}-0.68.0
      - name: Install Kani 0.68.0
        if: steps.kani.outputs.cache-hit != 'true'
        run: |
          cargo install kani-verifier --version 0.68.0 --locked
          cargo kani setup
      # A standard runner of a private repository has 7 GB (6.6 free) and 3 GB of swap of its own at /swapfile; the
      # checker peaks at 5.5 GB on the agent tick. More swap on the runner's disk keeps a harness that grows past
      # that from taking the runner down with it (the first run on main lost two groups to "The runner has received
      # a shutdown signal"). A safety net, not a requirement: every harness is bounded to fit the memory alone.
      - name: 8 GB of swap beside the runner's memory
        run: |
          { sudo fallocate -l 8G /swapfile.kani || sudo dd if=/dev/zero of=/swapfile.kani bs=1M count=8192; } \
            && sudo chmod 600 /swapfile.kani && sudo mkswap /swapfile.kani && sudo swapon /swapfile.kani \
            || echo "::warning::no swap could be added; the harnesses run within the runner's memory alone"
          free -m
      - name: The proof harnesses of this group
        run: sh tools/verify/fvps.sh kani ${{ matrix.group.harnesses }}
