[package]
name = "kv-pager"
version = "0.1.0"
edition = "2021"
publish = false
description = "A paged KV-cache page table with prefix caching, the WGSL attention kernel that reads it, and a GGUF weight streamer"
license-file = "../../LICENSE"

[features]
default = ["weights"]
# The page table has no dependencies; the GPU pool, the decode pipeline and the stress run need wgpu.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# The GGUF index, the sector-aligned weight streamer and the swarm read planner: files and threads, so left out of the
# WebAssembly build (kv-pager-wasm turns default features off).
weights = []

[dependencies]
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[[bin]]
name = "stress"
required-features = ["gpu"]

[[bin]]
name = "stream"
required-features = ["weights"]

[[example]]
name = "adapters"
required-features = ["gpu"]
