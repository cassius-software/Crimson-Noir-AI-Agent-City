<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- The air gap the browser enforces (docs/zero-trust-audit.md): nothing loads from or connects to any host but this
         machine, for the page, for the iframes and blob workers it could create, and for everything they create. The
         single file inlines its scripts and styles ('unsafe-inline'); the operator tier runs scripts and the physics is
         WebAssembly ('unsafe-eval', 'wasm-unsafe-eval'); the physics worker is a blob: URL. Chromium refuses an IPv6
         literal such as [::1] as a source, so the policy names localhost and 127.0.0.1 only: stricter than the gate. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' data: blob: http://localhost:* https://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* https://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:*; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'" />
    <!-- Link hints (dns-prefetch, preconnect) are outside every CSP directive: this turns the implicit ones off; an
         injected explicit hint is a known limit (docs/zero-trust-audit.md). -->
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <!-- The percent-wrapped BRAND tokens below are filled from src/brand.ts by the brand-html plugin (vite.config.ts). -->
    <meta name="application-name" content="%BRAND_NAME%" />
    <meta name="description" content="%BRAND_TAGLINE%" />
    <link rel="icon" type="image/svg+xml" href="%BRAND_ICON%" />
    <title>%BRAND_NAME%</title>
    <!-- The boot veil's look, the one definition shared with src/07_Execute_Actions/BootVeil.tsx (same classes):
         the page is black with the Monolith from its first paint, and React takes it over pixel for pixel.
         Unlayered, so Tailwind's layered preflight cannot restyle it. -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      .boot-veil { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: #000; }
      .boot-mark {
        width: clamp(80px, 14vmin, 120px);
        height: clamp(80px, 14vmin, 120px);
        border-radius: 23.333%; /* the mark's rx 28 of 120 */
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 0 28px rgba(255, 255, 255, 0.1), 0 0 96px rgba(255, 255, 255, 0.06);
      }
      .boot-mark > svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.2)); }
    </style>
    <!-- The boot watchdog: classic ES5, before the page's module, so it runs on any browser that runs scripts at all.
         If the module never ran (a download cut off, a browser too old to read it, an error while it loaded), the page
         would stay a black splash with nothing to press, and the installed iPhone app (full screen) and the Windows
         app have no reload of their own: at load, unless the module said it started (window.__bootDone, main.tsx), it
         draws a card with the reason and Restart (focused; Enter, a pad's A). main.tsx hands it React's uncaught
         errors too (window.__bootFatal). Pinned by src/bootWatchdog.test.ts, which also keeps it before the module in
         dist/index.html. -->
    <script id="boot-watchdog">
      (function () {
        var w = window, d = document, seen = [], shown = false
        function make(tag, css, text) {
          var e = d.createElement(tag)
          if (css) e.setAttribute('style', css)
          if (text) e.appendChild(d.createTextNode(text))
          return e
        }
        function appName() {
          var m = d.querySelector('meta[name="application-name"]')
          return (m && m.getAttribute('content')) || 'The city'
        }
        function restart() { w.location.reload() }
        function toConsole() {
          var q = w.location.search.replace(/^\?/, '').split('&'), out = ['boot=tty'], i
          for (i = 0; i < q.length; i++) if (q[i] && q[i].split('=')[0] !== 'boot') out.push(q[i])
          w.location.assign(w.location.pathname + '?' + out.join('&') + w.location.hash)
        }
        function button(text, dark, act) {
          var b = make('button', 'min-height:44px;margin:0 8px 8px 0;padding:8px 16px;border-radius:12px;font:600 14px system-ui,sans-serif;cursor:pointer;' +
            (dark ? 'border:0;background:#0f172a;color:#fff' : 'border:1px solid #cbd5e1;background:#fff;color:#0f172a'), text)
          b.type = 'button'
          b.onclick = act
          return b
        }
        // title: the headline; lines: what happened and what to do; detail: the raw reason; withConsole: offer the
        // ?boot=tty shell too (only once the page's script has run: before that the console cannot load either).
        function fatal(title, lines, detail, withConsole) {
          if (shown) return
          shown = true
          var shade = make('div', 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:10002;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:16px;padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));background:rgba(0,0,0,.7);font:14px/1.6 system-ui,sans-serif')
          var card = make('div', 'box-sizing:border-box;width:100%;max-width:576px;max-height:100%;overflow-y:auto;padding:20px;border-radius:16px;background:#f8fafc;color:#0f172a')
          var head = make('h1', 'margin:0 0 12px;font-size:18px;line-height:1.4', title), i
          shade.setAttribute('role', 'alertdialog')
          shade.setAttribute('aria-modal', 'true')
          shade.setAttribute('aria-label', title)
          shade.setAttribute('data-failure', 'page')
          card.appendChild(head)
          for (i = 0; i < lines.length; i++) card.appendChild(make('p', 'margin:0 0 8px;word-wrap:break-word;word-break:break-word', lines[i]))
          var row = make('div', 'margin-top:16px'), again = button('Restart', true, restart)
          row.appendChild(again)
          if (withConsole) row.appendChild(button('Open the console', false, toConsole))
          card.appendChild(row)
          card.appendChild(make('p', 'margin:8px 0 0;font:11px/1.5 ui-monospace,monospace;color:#64748b;word-wrap:break-word;word-break:break-word',
            (detail || 'No message was given.') + ' · build %BRAND_VERSION% · ' + navigator.userAgent))
          shade.appendChild(card)
          ;(d.body || d.documentElement).appendChild(shade)
          again.focus()
          w.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) restart()
          })
          // A pad's A: a press only on a pad that was there, A up, at the last look (a pad revealed by its own press,
          // or one whose A was held when the card appeared, presses nothing until A is released).
          var was = null
          setInterval(function () {
            var pads = [], now = {}, press = false, j
            try { pads = navigator.getGamepads ? navigator.getGamepads() : [] } catch (err) { pads = [] }
            for (j = 0; j < pads.length; j++) {
              if (!pads[j]) continue
              now[j] = !!(pads[j].buttons[0] && pads[j].buttons[0].pressed)
              if (now[j] && was && was[j] === false) press = true
            }
            if (press) (d.activeElement && d.activeElement.tagName === 'BUTTON' ? d.activeElement : again).click()
            was = now
          }, 50)
        }
        w.__bootFatal = fatal
        w.addEventListener('error', function (e) {
          if (!w.__bootDone) seen.push(e.error || { name: '', message: e.message })
        })
        // What the city itself will need once the page runs, where this browser plainly lacks it: a secure address,
        // iOS 26 on an iPhone or iPad (Safari's Version token), WebGPU. Nothing under ?boot=tty: the console needs none.
        function needs() {
          var ua = navigator.userAgent, ios = /\b(iPhone|iPad|iPod)\b/.exec(ua), v = /\bVersion\/(\d+)/.exec(ua)
          if (/[?&]boot=tty(?:&|$)/.test(w.location.search)) return []
          if (w.isSecureContext === false) return ['The city also needs a secure address: open the page over https://.']
          if (ios && v && +v[1] < 26) {
            return [ios[1] === 'iPad' ? 'The city also needs iPadOS 26 on this iPad.' : 'The city also needs iOS 26 on this iPhone (iPhone 11, iPhone SE (2nd generation) and newer).']
          }
          if (!('gpu' in navigator)) return ['The city also needs WebGPU: a current Chrome, Edge or Brave, or Safari 26.']
          return []
        }
        w.addEventListener('load', function () {
          setTimeout(function () {
            if (w.__bootDone) return
            var name = appName(), first = seen[0], update = 'If it happens again, update the browser (on an iPhone or iPad: Settings > General > Software Update).'
            var then = ['Restart to load it again.', update].concat(needs())
            if (!first) fatal(name + ' couldn’t start', ['The page did not finish downloading, or this browser did not run its script.'].concat(then), 'the page’s script never ran', false)
            else if (first.name === 'SyntaxError') fatal(name + ' couldn’t start', ['This browser could not read the page’s script: it is older than ' + name + ' needs, or the download was cut off.'].concat(then), 'SyntaxError: ' + first.message, false)
            else fatal(name + ' couldn’t start', ['The page stopped while it was loading.'].concat(then), (first.name ? first.name + ': ' : '') + first.message, false)
          }, 0)
        })
      })()
    </script>
  </head>
  <body>
    <!-- React replaces this on mount with the identical BootVeil, which then fades into the city. -->
    <div id="root">
      <div class="boot-veil" role="img" aria-label="%BRAND_NAME% is starting">
        <div class="boot-mark">%BRAND_MARK%</div>
        <!-- source-only: brand-html removes everything up to the closing marker (dev server and build) -->
        <p style="position: absolute; right: 24px; bottom: 24px; left: 24px; margin: 0; color: #94a3b8; font: 13px/1.6 system-ui, sans-serif; text-align: center">
          This is the source entry, which only runs under <code>npm run dev</code>. To play, open <code>dist/index.html</code>.
        </p>
        <!-- /source-only -->
      </div>
    </div>
    <!-- Scripts off (a setting, a content blocker, or the Files app's preview, which runs none): words instead of a
         black splash forever. -->
    <noscript>
      <div style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10002; display: flex; align-items: center; justify-content: center; padding: 16px; background: #000; color: #e2e8f0; font: 15px/1.6 system-ui, sans-serif">
        <div style="max-width: 576px">
          <p style="margin: 0 0 12px; font-size: 18px; font-weight: 600; color: #fff">%BRAND_NAME% needs JavaScript</p>
          <p style="margin: 0 0 8px">Turn JavaScript on for this page, then open it again. On an iPhone or iPad: Settings &gt; Apps &gt; Safari &gt; Advanced &gt; JavaScript (before iOS 18: Settings &gt; Safari &gt; Advanced).</p>
          <p style="margin: 0">Opened from the Files app? Its preview runs no scripts: open the page's https:// address in Safari instead.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
